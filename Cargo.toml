[package]
name = "log-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.41", features = ["serialize", "encoding"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Performance"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(browser_smoke)'] }
